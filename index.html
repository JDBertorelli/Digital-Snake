<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Snake - GitHub Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 { margin-bottom: 10px; font-size: 2rem; color: #38bdf8; }
    .score-board {
      font-size: 1.2rem;
      margin-bottom: 15px;
      display: flex;
      gap: 20px;
    }
    canvas {
      border: 3px solid #38bdf8;
      border-radius: 8px;
      background-color: #020617;
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.25);
    }
    .controls-hint {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <h1>Snake Arcade</h1>
  <div class="score-board">
    <div>Puntos: <span id="score">0</span></div>
    <div>Récord: <span id="high-score">0</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <p class="controls-hint">Usa las **Flechas del Teclado** o **WASD** para moverte. Presiona **Espacio** para reiniciar.</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("high-score");

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [{ x: 10, y: 10 }];
    let velocity = { x: 0, y: 0 };
    let food = { x: 15, y: 15 };
    let score = 0;
    let highScore = localStorage.getItem("snake_high_score") || 0;
    let gameOver = false;

    highScoreEl.textContent = highScore;

    function gameLoop() {
      update();
      draw();
      if (!gameOver) {
        setTimeout(gameLoop, 100);
      }
    }

    function update() {
      if (velocity.x === 0 && velocity.y === 0) return;

      const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

      // Colisión con bordes
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        return triggerGameOver();
      }

      // Colisión con propio cuerpo
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          return triggerGameOver();
        }
      }

      snake.unshift(head);

      // Colisión con comida
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem("snake_high_score", highScore);
        }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Fondo
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Comida
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * GRID_SIZE, (food.y + 0.5) * GRID_SIZE, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Serpiente
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#38bdf8" : "#0284c7";
        ctx.fillRect(part.x * GRID_SIZE + 1, part.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      });

      // Pantalla de Game Over
      if (gameOver) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#f8fafc";
        ctx.font = "24px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("¡Game Over!", canvas.width / 2, canvas.height / 2 - 10);
        
        ctx.font = "14px 'Segoe UI', sans-serif";
        ctx.fillStyle = "#94a3b8";
        ctx.fillText("Presiona ESPACIO para volver a jugar", canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function placeFood() {
      food = {
        x: Math.floor(Math.random() * TILE_COUNT),
        y: Math.floor(Math.random() * TILE_COUNT)
      };
    }

    function triggerGameOver() {
      gameOver = true;
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      velocity = { x: 0, y: 0 };
      score = 0;
      scoreEl.textContent = score;
      gameOver = false;
      placeFood();
      gameLoop();
    }

    window.addEventListener("keydown", e => {
      switch (e.key) {
        case "ArrowUp": case "w": case "W":
          if (velocity.y !== 1) velocity = { x: 0, y: -1 };
          break;
        case "ArrowDown": case "s": case "S":
          if (velocity.y !== -1) velocity = { x: 0, y: 1 };
          break;
        case "ArrowLeft": case "a": case "A":
          if (velocity.x !== 1) velocity = { x: -1, y: 0 };
          break;
        case "ArrowRight": case "d": case "D":
          if (velocity.x !== -1) velocity = { x: 1, y: 0 };
          break;
        case " ":
          if (gameOver) resetGame();
          break;
      }
    });

    gameLoop();
  </script>
</body>
</html>
